name: Ecommerce CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  backend-build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nexshop_output/backend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Give Maven Permission
        run: chmod +x mvnw

      - name: Build Backend
        run: ./mvnw clean install

  frontend-build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nexshop_output/frontend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build